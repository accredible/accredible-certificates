name: "Linting and unit tests"

on:
  workflow_dispatch:
  push:
    branches: ['develop', 'master']
  pull_request:
    branches: ['develop', 'master']

jobs:
  code_sniffer:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, mysqlnd
          coverage: none
          tools: composer:v2

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install project dependencies
        run: |
          if [ -f composer.json ]; then
            composer install --prefer-dist --no-progress --no-suggest
          fi

      - name: Install WordPress Coding Standards
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require phpcompatibility/phpcompatibility-paragonie phpcompatibility/phpcompatibility-wp 
          composer global require phpcsstandards/phpcsutils phpcsstandards/phpcsextra wp-coding-standards/wpcs dealerdirect/phpcodesniffer-composer-installer
          phpcs -i

      - name: Run PHP CodeSniffer
        run: |
          phpcs --version
          phpcs

  unit_tests:
      runs-on: ubuntu-latest
      strategy:
        fail-fast: false
        matrix:
          include:
            - php: '7.4'
              composer: 2
              wordpress: '6.2'
            - php: '8.2'
              composer: 2
              wordpress: '6.6'

      services:
        mysql:
          image: mysql:5.7
          env:
            MYSQL_ROOT_PASSWORD: wordpress
            MYSQL_DATABASE: wordpress
            MYSQL_USER: wordpress
            MYSQL_PASSWORD: wordpress
          ports:
            - 3306:3306
          options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

      name: WP version ${{ matrix.wordpress }} on PHP ${{ matrix.php }}

      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Setup PHP ${{ matrix.php }}
          uses: shivammathur/setup-php@v2
          with:
            php-version: ${{ matrix.php }}

        - name: Build Composer Version ${{ matrix.composer }}
          uses: php-actions/composer@v6
          with:
            php_version: ${{ matrix.php }}
            version: ${{ matrix.composer }}
            command: update

        - name: Install SVN
          run: |
            sudo apt-get update
            sudo apt-get install -y subversion

        - name: Initialise WP Test environment
          env:
            DB_PORT: 3306
          run: |
            bash bin/install-wp-tests.sh wordpress wordpress wordpress 127.0.0.1:3306 ${{ matrix.wordpress }} true

        - name: Run PHPUnit tests
          run: |
            ./vendor/bin/phpunit --version
            ./vendor/bin/phpunit
          env:
            WP_TESTS_DIR: /tmp/wordpress-tests-lib
            WP_CORE_DIR: /tmp/wordpress