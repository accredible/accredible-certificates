name: "Linting and unit tests"

on:
  workflow_dispatch:
  push:
    branches: ['develop', 'master']
  pull_request:
    branches: ['develop', 'master']

jobs:
  lint:
    name: "PHP CodeSniffer (WordPress Coding Standards)"
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, mysqlnd
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install WordPress Coding Standards
        run: |
          composer global config allow-plugins.dealerdirect/phpcodesniffer-composer-installer true
          composer global require --dev wp-coding-standards/wpcs
          composer global require --dev dealerdirect/phpcodesniffer-composer-installer
          composer global require --dev phpcsstandards/phpcsutils
          composer global require --dev phpcsstandards/phpcsextra
          phpcs --config-set installed_paths vendor/wp-coding-standards/wpcs, vendor/phpcsstandards/phpcsutils, vendor/phpcsstandards/phpcsextra

      - name: Run PHP CodeSniffer
        run: |
          phpcs --standard=WordPress --extensions=php --ignore=*/vendor/*,*/node_modules/*,*/tests/*,*/post-types/* .
